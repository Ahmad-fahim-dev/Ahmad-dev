<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Detail — Ahmad Fahim</title>
    <link rel="stylesheet" href="style.css">
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        .blog-content {
            font-size: 1.25rem;
            max-width: 800px;
            margin: 0 auto;
            column-count: 1;
            /* Keep single column for internal content for readability */
        }

        .blog-content p {
            margin-bottom: 25px;
        }

        .blog-content blockquote {
            font-style: italic;
            border-left: var(--border-thick);
            padding-left: 20px;
            margin: 40px 0;
            font-family: var(--font-mono);
        }

        .article-img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            border: var(--border-thin);
            margin-bottom: 40px;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <header>
            <nav>
                <div class="nav-container">
                    <div class="nav-links">
                        <a href="index.html">Cover</a>
                        <a href="index.html#about">About</a>
                        <a href="index.html#skills">Skills</a>
                        <a href="projects.html">Work</a>
                        <a href="blog.html" class="active">Articles</a>
                        <a href="index.html#contact">Contact</a>
                    </div>
                    <button class="theme-toggle" id="theme-toggle">Dark Mode</button>
                </div>
            </nav>
        </header>

        <a href="blog.html" class="read-more" style="display: block; margin-bottom: 40px;">← RETURN TO ARTICLES</a>

        <div id="blog-container">
            <div style="font-family: 'Special Elite';">Loading dispatch details...</div>
        </div>

        <footer>
            <div>&copy; 1925-2025 AHMAD FAHIM</div>
            <div>PRINTED IN GLOBAL NETWORK</div>
            <div>VOL. VIII</div>
        </footer>
    </div>

    <script>
        const API_URL = '/api';

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function fetchBlog() {
            const blogId = getQueryParam('id');
            const container = document.getElementById('blog-container');

            if (!blogId) {
                container.innerHTML = '<div style="font-family: \'Special Elite\';">⚠️ ARTICLE ID NOT SPECIFIED.</div>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/blogs/${blogId}`);

                if (!response.ok) {
                    if (response.status === 404) {
                        container.innerHTML = '<div style="font-family: \'Special Elite\';">⚠️ ARTICLE NOT FOUND IN ARCHIVE.</div>';
                        return;
                    }
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Server error: ${response.status}`);
                }

                const blog = await response.json();

                container.innerHTML = `
                    <article>
                        ${blog.image ? `<img src="${blog.image}" alt="${blog.title}" class="article-img" onerror="this.style.display='none'">` : ''}
                        <h1 class="huge-title" style="font-size: 4rem; margin-bottom: 20px;">${blog.title}</h1>
                        <div class="meta" style="font-family: 'Special Elite'; color: var(--accent); margin-bottom: 40px; padding-bottom: 20px; border-bottom: var(--border-thin);">
                            ${new Date(blog.createdAt).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                })} — AUTHOR: ${blog.author.toUpperCase()}
                        </div>
                        <div class="blog-content">${blog.content}</div>
                    </article>
                `;
            } catch (error) {
                console.error('Error fetching blog:', error);
                container.innerHTML = `<div style="font-family: 'Special Elite'; color: #d9534f;">⚠️ ERROR RETRIEVING DISPATCH: ${error.message}</div>`;
            }
        }

        fetchBlog();

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.textContent = 'Light Mode';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? 'Light Mode' : 'Dark Mode';
        });
    </script>
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>

</html>
