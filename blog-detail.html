<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <meta name="title" id="meta-title" content="Article Detail — Ahmad Fahim">
    <meta name="description" id="meta-desc"
        content="Read this article by Ahmad Fahim regarding Artificial Intelligence and Python development.">
    <meta name="author" id="meta-author" content="Ahmad Fahim">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" id="meta-og-url" content="https://ahmad-dev-mtwo.vercel.app/blog-detail.html">
    <meta property="og:title" id="meta-og-title" content="Article Detail — Ahmad Fahim">
    <meta property="og:description" id="meta-og-desc"
        content="Read this article by Ahmad Fahim regarding Artificial Intelligence and Python development.">
    <meta property="og:image" id="meta-og-image" content="https://ahmad-dev-mtwo.vercel.app/AA.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" id="meta-twitter-url" content="https://ahmad-dev-mtwo.vercel.app/blog-detail.html">
    <meta property="twitter:title" id="meta-twitter-title" content="Article Detail — Ahmad Fahim">
    <meta property="twitter:description" id="meta-twitter-desc"
        content="Read this article by Ahmad Fahim regarding Artificial Intelligence and Python development.">
    <meta property="twitter:image" id="meta-twitter-image" content="https://ahmad-dev-mtwo.vercel.app/AA.jpg">

    <link rel="stylesheet" href="style.css">
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        .blog-content {
            font-size: 1.2rem;
            width: 100%;
            max-width: 100%;
            margin: 0;
            font-family: var(--font-serif);
            line-height: 1.85;
            color: var(--ink-black);
        }

        /* — Paragraphs — */
        .blog-content p {
            margin-bottom: 1.6em;
            text-align: left;
            hyphens: auto;
        }

        /* — Drop Cap on first paragraph — */
        .blog-content>p:first-of-type::first-letter {
            font-family: var(--font-heading);
            float: left;
            font-size: 4.2rem;
            line-height: 0.8;
            padding-right: 10px;
            padding-top: 6px;
            color: var(--accent);
            font-weight: 700;
        }

        /* — Headings — */
        .blog-content h2 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            margin: 2.5em 0 0.8em;
            padding-bottom: 0.3em;
            border-bottom: var(--border-thin);
            line-height: 1.15;
        }

        .blog-content h3 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            margin: 2em 0 0.6em;
            line-height: 1.2;
        }

        .blog-content h4 {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 700;
            font-style: italic;
            margin: 1.8em 0 0.5em;
        }

        /* — Blockquotes (magazine pull-quote style) — */
        .blog-content blockquote {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.35rem;
            line-height: 1.7;
            border-left: 4px solid var(--accent);
            padding: 20px 30px;
            margin: 2.5em 0;
            background: rgba(0, 0, 0, 0.02);
            position: relative;
        }

        body.dark-mode .blog-content blockquote {
            background: rgba(255, 255, 255, 0.03);
        }

        .blog-content blockquote p {
            margin-bottom: 0.5em;
        }

        .blog-content blockquote p:last-child {
            margin-bottom: 0;
        }

        /* — Lists — */
        .blog-content ul,
        .blog-content ol {
            padding-left: 1.8em;
            margin-bottom: 1.6em;
        }

        .blog-content li {
            margin-bottom: 0.6em;
            line-height: 1.7;
        }

        .blog-content ul li::marker {
            color: var(--accent);
        }

        /* — Links — */
        .blog-content a {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            transition: opacity 0.2s;
        }

        .blog-content a:hover {
            opacity: 0.75;
        }

        /* — Bold & Emphasis — */
        .blog-content strong,
        .blog-content b {
            font-weight: 700;
            color: var(--ink-black);
        }

        .blog-content em,
        .blog-content i {
            font-style: italic;
        }

        /* — Article Hero Image — */
        .article-img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            border: var(--border-thin);
            margin-bottom: 40px;
        }

        /* — Responsive adjustments — */
        @media (max-width: 768px) {
            .blog-content {
                font-size: 1.05rem;
                line-height: 1.75;
            }

            .blog-content h2 {
                font-size: 1.7rem;
            }

            .blog-content h3 {
                font-size: 1.25rem;
            }

            .blog-content blockquote {
                font-size: 1.1rem;
                padding: 15px 20px;
                margin: 1.8em 0;
            }

            .blog-content>p:first-of-type::first-letter {
                font-size: 3.2rem;
            }

            .blog-content p {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <header>
            <nav>
                <div class="nav-container">
                    <div class="nav-links">
                        <a href="index.html">Cover</a>
                        <a href="index.html#about">About</a>
                        <a href="index.html#skills">Skills</a>
                        <a href="projects.html">Work</a>
                        <a href="blog.html" class="active">Articles</a>
                        <a href="index.html#contact">Contact</a>
                    </div>
                    <button class="theme-toggle" id="theme-toggle">Dark Mode</button>
                </div>
            </nav>
        </header>

        <a href="blog.html" class="read-more" style="display: block; margin-bottom: 40px;">← RETURN TO ARTICLES</a>

        <div id="blog-container">
            <div style="font-family: 'Special Elite';">Loading dispatch details...</div>
        </div>

        <footer>
            <div>&copy; 1925-2025 AHMAD FAHIM</div>
            <div>PRINTED IN GLOBAL NETWORK</div>
            <div>VOL. VIII</div>
        </footer>
    </div>

    <script>
        const API_URL = '/api';

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function fetchBlog() {
            const blogId = getQueryParam('id');
            const container = document.getElementById('blog-container');

            if (!blogId) {
                container.innerHTML = '<div style="font-family: \'Special Elite\';">⚠️ ARTICLE ID NOT SPECIFIED.</div>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/blogs/${blogId}`);

                if (!response.ok) {
                    if (response.status === 404) {
                        container.innerHTML = '<div style="font-family: \'Special Elite\';">⚠️ ARTICLE NOT FOUND IN ARCHIVE.</div>';
                        return;
                    }
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Server error: ${response.status}`);
                }

                const blog = await response.json();

                // Dynamically update SEO meta tags
                document.title = `${blog.title} — Ahmad Fahim`;
                document.getElementById('meta-title').content = blog.title;
                document.getElementById('meta-og-title').content = blog.title;
                document.getElementById('meta-twitter-title').content = blog.title;

                if (blog.excerpt) {
                    document.getElementById('meta-desc').content = blog.excerpt;
                    document.getElementById('meta-og-desc').content = blog.excerpt;
                    document.getElementById('meta-twitter-desc').content = blog.excerpt;
                }

                if (blog.image) {
                    document.getElementById('meta-og-image').content = blog.image;
                    document.getElementById('meta-twitter-image').content = blog.image;
                }

                document.getElementById('meta-og-url').content = window.location.href;
                document.getElementById('meta-twitter-url').content = window.location.href;
                document.getElementById('meta-author').content = blog.author;

                container.innerHTML = `
                    <article>
                        ${blog.image ? `<img src="${blog.image}" alt="${blog.title}" class="article-img" onerror="this.style.display='none'">` : ''}
                        <h1 class="huge-title" style="font-size: 4rem; margin-bottom: 20px;">${blog.title}</h1>
                        <div class="meta" style="font-family: 'Special Elite'; color: var(--accent); margin-bottom: 40px; padding-bottom: 20px; border-bottom: var(--border-thin);">
                            ${new Date(blog.createdAt).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                })} — AUTHOR: ${blog.author.toUpperCase()}
                        </div>
                        <div class="blog-content">${blog.content}</div>
                    </article>
                `;
            } catch (error) {
                console.error('Error fetching blog:', error);
                container.innerHTML = `<div style="font-family: 'Special Elite'; color: #d9534f;">⚠️ ERROR RETRIEVING DISPATCH: ${error.message}</div>`;
            }
        }

        fetchBlog();

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.textContent = 'Light Mode';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? 'Light Mode' : 'Dark Mode';
        });
    </script>
</body>

</html>
