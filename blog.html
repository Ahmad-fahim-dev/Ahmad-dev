<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Editorial Feed — Ahmad Fahim</title>
    <link rel="stylesheet" href="style.css">
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <div class="page-wrapper">
        <header>
            <nav>
                <div class="nav-container">
                    <div class="nav-links">
                        <a href="index.html">Cover</a>
                        <a href="index.html#about">About</a>
                        <a href="index.html#skills">Skills</a>
                        <a href="projects.html">Work</a>
                        <a href="blog.html" class="active">Articles</a>
                        <a href="index.html#contact">Contact</a>
                    </div>
                    <button class="theme-toggle" id="theme-toggle">Dark Mode</button>
                </div>
            </nav>
        </header>

        <section id="blog-header">
            <h1 class="huge-title">ARTICLES<br>& FEED</h1>
            <div class="tagline-box">
                DISPATCHES ON ARTIFICIAL INTELLIGENCE, PYTHON, AND MODERN COMPUTING
            </div>
        </section>

        <div class="hr-double"></div>

        <div id="blog-container" class="editorial-grid">
            <div style="font-family: 'Special Elite';">Retrieving latest dispatches...</div>
        </div>

        <footer>
            <div>&copy; 1925-2025 AHMAD FAHIM</div>
            <div>PRINTED IN GLOBAL NETWORK</div>
            <div>VOL. VIII</div>
        </footer>
    </div>

    <script>
        const API_URL = '/api';

        async function fetchBlogs() {
            const container = document.getElementById('blog-container');
            try {
                const response = await fetch(`${API_URL}/blogs`);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Server error: ${response.status}`);
                }

                const blogs = await response.json();

                if (blogs.length === 0) {
                    container.innerHTML = '<div style="font-family: \'Special Elite\'; grid-column: span 2;">NO ARTICLES FOUND IN FEED.</div>';
                    return;
                }

                container.innerHTML = blogs.map(blog => `
                    <div class="editorial-block">
                        <a href="blog-detail.html?id=${blog.id}" style="text-decoration: none; color: inherit;">
                            ${blog.image ? `<img src="${blog.image}" alt="${blog.title}" onerror="this.style.display='none'">` : ''}
                            <div class="meta">
                                ${new Date(blog.createdAt).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                })} — ${blog.author}
                            </div>
                            <h3>${blog.title}</h3>
                            <p>${blog.excerpt}</p>
                            <span class="read-more">CONTINUE READING →</span>
                        </a>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error fetching blogs:', error);
                container.innerHTML = `<div style="font-family: 'Special Elite'; grid-column: span 2; color: #d9534f;">⚠️ ERROR RETRIEVING FEED: ${error.message}</div>`;
            }
        }

        fetchBlogs();

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.textContent = 'Light Mode';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? 'Light Mode' : 'Dark Mode';
        });
    </script>
</body>

</html>
